<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #11141c; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .word {
    position: fixed; left: 50%; top: 50%;
    margin: 0; white-space: pre; line-height: 1;
    mix-blend-mode: screen;
    pointer-events: none; user-select: none;
    will-change: transform, opacity, filter;
  }
  .word span { opacity: 0; filter: blur(8px); transition: opacity 0.9s ease-out, filter 0.9s ease-out; }
  .word span.on { opacity: 1; filter: blur(0); }
  #fx {
    position: fixed; left: 16px; bottom: 24px; z-index: 1;
    font-family: var(--font); font-size: var(--fs); font-style: var(--fstyle); line-height: 1.4;
    text-transform: var(--case); color: var(--ink);
    background: var(--panel); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border-radius: var(--radius); padding: 8px 12px; box-shadow: var(--shadow);
    --edge: color-mix(in srgb, var(--fill) 70%, #000);
  }
  #fx summary { cursor: pointer; font-weight: 600; margin-right: 4em; height: 20px; line-height: 20px; white-space: nowrap; }
  #fx summary::marker { color: var(--fill); }
  /* fixed geometry: sliders stay put across styles */
  #fx form { display: grid; grid-template-columns: 92px 140px 44px; grid-auto-rows: 22px; align-items: center; gap: 2px 10px; margin-top: 8px; }
  #fx form span, #fx output { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #fx label { display: contents; }
  #fx button {
    position: absolute; top: 6px; right: 8px; font: inherit; cursor: pointer;
    color: var(--btn-ink); background: var(--fill); border: 0; border-radius: min(var(--radius), 6px); padding: 1px 6px;
    font-size: 0.85em; text-transform: lowercase;
    box-shadow: 2px 2px 0 var(--edge);
  }
  #fx button:hover { background: var(--ink); }
  #fx button:active { transform: translate(2px, 2px); box-shadow: none; }
  #fx button:focus-visible, #fx summary:focus-visible, #fx input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #fx input {
    -webkit-appearance: none; appearance: none; width: 100%; height: 6px; margin: 0; border-radius: 3px;
    background: linear-gradient(to right, var(--fill) var(--p, 0%), var(--track) var(--p, 0%));
  }
  #fx input::-webkit-slider-thumb {
    -webkit-appearance: none; width: var(--tw); height: var(--th); border-radius: var(--tr);
    background: var(--thumb); box-shadow: 2px 2px 0 var(--edge); cursor: pointer;
  }
  #fx input::-moz-range-thumb {
    width: var(--tw); height: var(--th); border: 0; border-radius: var(--tr);
    background: var(--thumb); box-shadow: 2px 2px 0 var(--edge); cursor: pointer;
  }
  #fx output { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  #msg {
    --s: 18vmin;
    position: fixed; left: 50%; top: 50%; z-index: 1;
    width: var(--s); height: var(--s); margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
    display: grid; place-items: center;
  }
  /* font-size 16px stops iOS zoom on focus */
  #msg textarea {
    position: absolute; inset: 0; resize: none; padding: 0; border: 0; outline: 0; background: none;
    font: 16px serif; color: transparent; caret-color: transparent; pointer-events: none;
  }
  .say {
    margin: 0; width: 100%; line-height: 1.15; text-align: center;
    white-space: pre-wrap; overflow-wrap: anywhere; pointer-events: none;
  }
  .fall { position: fixed; left: 50%; top: 50%; z-index: 1; transform: translate(-50%, -50%); }
  .caret {
    display: inline-block; width: 0; height: 1em; margin-right: -2px; vertical-align: -0.12em;
    border-left: 2px solid #f9c747; animation: blink 1.06s steps(1) infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

<script id="common" type="x-shader/x-fragment">
precision highp float;
uniform vec2 res;
uniform float t;
uniform vec2 m;

#define TAU 6.28318
const float R = .13;

const vec3 BG    = vec3(.067, .078, .106);
const vec3 HOLE  = vec3(.035, .04, .055);
const vec3 CREAM = vec3(.98, .94, .84);
const vec3 YEL   = vec3(.98, .78, .28);
const vec3 ORA   = vec3(.95, .42, .2);
const vec3 RED   = vec3(.86, .24, .2);
const vec3 CYAN  = vec3(.32, .74, .86);
const vec3 BLUE  = vec3(.22, .42, .8);

float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

// value noise, periodic in y with period `per` (hides the angular seam)
float noise(vec2 p, float per) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3. - 2. * f);
  float y0 = mod(i.y, per), y1 = mod(i.y + 1., per);
  return mix(mix(hash(vec2(i.x, y0)), hash(vec2(i.x + 1., y0)), f.x),
             mix(hash(vec2(i.x, y1)), hash(vec2(i.x + 1., y1)), f.x), f.y);
}

float fbm(vec2 p, float per) {
  float s = 0., a = .5;
  for (int i = 0; i < 5; i++) {
    s += a * noise(p, per);
    p = p * 2. + vec2(17.3, 0.);
    per *= 2.;
    a *= .5;
  }
  return s;
}

float hash3(vec3 p) {
  p = fract(p * .3183099 + .1) * 17.;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float noise3(vec3 x) {
  vec3 i = floor(x), f = fract(x);
  f = f * f * (3. - 2. * f);
  return mix(mix(mix(hash3(i), hash3(i + vec3(1, 0, 0)), f.x),
                 mix(hash3(i + vec3(0, 1, 0)), hash3(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash3(i + vec3(0, 0, 1)), hash3(i + vec3(1, 0, 1)), f.x),
                 mix(hash3(i + vec3(0, 1, 1)), hash3(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}

float fbm3(vec3 p) {
  float s = 0., a = .5;
  for (int i = 0; i < 4; i++) {
    s += a * noise3(p);
    p = p * 2.02 + vec3(1.7, 9.2, 3.1);
    a *= .5;
  }
  return s;
}

vec2 view() { return (gl_FragCoord.xy - .5 * res) / min(res.x, res.y) - m * .015; }
</script>

<script id="bg" type="x-shader/x-fragment">
uniform float uNest, uNeb, uStars, uTunnel, uLens;

// Kali's "Star Nest" folded fractal volume
vec3 starNest(vec2 uv) {
  vec3 dir = normalize(vec3(uv * .8, 1.));
  vec3 from = vec3(1., .5, .5) + vec3(m * .05 + t * .002, -t * .003);
  float s = .1, fade = 1.;
  vec3 v = vec3(0.);
  for (int r = 0; r < 12; r++) {
    vec3 p = from + s * dir * .5;
    p = abs(vec3(.85) - mod(p, vec3(1.7)));
    float pa = 0., a = 0.;
    for (int i = 0; i < 14; i++) {
      p = abs(p) / dot(p, p) - .53;
      a += abs(length(p) - pa);
      pa = length(p);
    }
    float dm = max(0., .3 - a * a * .001);
    a *= a * a;
    if (r > 6) fade *= 1. - dm;
    v += fade + vec3(s, s * s, s * s * s * s) * a * .0015 * fade;
    fade *= .73;
    s += .1;
  }
  return mix(vec3(length(v)), v, .85) * .009;
}

// raymarched fbm clouds
vec3 nebula(vec2 uv) {
  vec3 ro = vec3(m * .12, 0.), rd = normalize(vec3(uv, 1.2));
  vec3 acc = vec3(0.);
  float T = 1.;
  for (int i = 0; i < 24; i++) {
    vec3 p = ro + rd * (1. + float(i) * .12) + vec3(0., 0., t * .02);
    float den = smoothstep(.45, .85, fbm3(p * 1.3));
    vec3 c = mix(vec3(.28, .12, .48), vec3(.9, .42, .22), noise3(p * .6));
    c = mix(c, vec3(.2, .5, .85), smoothstep(.55, .8, noise3(p * .5 + 9.)));
    float a = den * .09;
    acc += T * a * c;
    T *= 1. - a;
  }
  return acc * 1.6;
}

// zooming cellular star layers, far ones sink toward the hole
vec3 starfield(vec2 uv) {
  vec3 c = vec3(0.);
  for (int i = 0; i < 5; i++) {
    float fi = float(i);
    float z = fract(fi / 5. - t * .008);
    float fade = smoothstep(0., .3, z) * smoothstep(1., .8, z);
    vec2 p = (uv - m * .04 * z) * mix(30., 3., z) + fi * 37.1;
    vec2 id = floor(p);
    float h = hash(id);
    vec2 o = (vec2(hash(id + .3), hash(id + .7)) - .5) * .7;
    float d = length(fract(p) - .5 - o);
    float star = .0006 / (d * d + .0006) * pow(h, 5.);
    vec3 tint = mix(vec3(.7, .8, 1.), vec3(1., .8, .6), hash(id + 2.));
    c += tint * star * fade;
  }
  return c * 1.4;
}

// inverse-distance throat falling into the hole
vec3 tunnel(vec2 uv) {
  float r = length(uv), a = atan(uv.y, uv.x);
  vec3 p = vec3(cos(a) * 1.2, sin(a) * 1.2, .25 / max(r, .02) + t * .12);
  float f = fbm3(p * 1.5);
  vec3 c = mix(vec3(.08, .1, .25), vec3(.35, .5, .9), f) * f;
  return c * exp(-.06 / max(r, .01)) * .9;
}

void main() {
  vec2 uv = view();
  float r = max(length(uv), 1e-3);
  float Re = R * 1.6;
  vec2 luv = uv - uv / r * uLens * Re * Re / r;

  vec3 col = BG + (hash(gl_FragCoord.xy + fract(t)) - .5) * .025;
  if (uTunnel > 0.) col += tunnel(uv) * uTunnel;
  if (uNeb > 0.)    col += nebula(luv) * uNeb;
  if (uNest > 0.)   col += starNest(luv) * uNest;
  if (uStars > 0.)  col += starfield(luv) * uStars;
  gl_FragColor = vec4(col, 1.);
}
</script>

<script id="fg" type="x-shader/x-fragment">
uniform float spin;

// lensed vertical smear; q.x across the streak, q.y away from the hole
vec4 streak(vec2 q, float seed) {
  float lines = pow(noise(vec2(q.x * 200. + seed, q.y * 1.5 - t * .05), 1e4), 2.);
  float len = .1 + .3 * noise(vec2(q.x * 50. + seed, 3.), 1e4);
  float fade = pow(smoothstep(len, 0., q.y), 1.5) * smoothstep(-.02, .04, q.y);
  float width = smoothstep(.075, .015, abs(q.x));
  vec3 c = mix(CYAN, BLUE, noise(vec2(q.x * 90. + seed, 1.), 1e4));
  c = mix(c, ORA, step(.78, noise(vec2(q.x * 130. + seed, 7.), 1e4)));
  c = mix(c, CREAM, step(.84, noise(vec2(q.x * 170. + seed, 9.), 1e4)));
  return vec4(c, clamp(lines * fade * width * 2.8, 0., 1.));
}

// dark wedge continuing the hole into the streak
float tail(vec2 q) {
  float w = .03 * smoothstep(.11, 0., q.y);
  float l = w * (.3 + noise(vec2(q.y * 70., 2.), 1e4));
  float r = w * (.3 + noise(vec2(q.y * 70. + 33., 5.), 1e4));
  return smoothstep(-l, -l + .004, q.x) * smoothstep(r, r - .004, q.x) * step(0., q.y);
}

// premultiplied "over"
void over(inout vec4 c, vec3 rgb, float a) { c = vec4(rgb * a, a) + c * (1. - a); }

void main() {
  vec2 uv = view();
  float r = length(uv);
  float a = atan(uv.y, uv.x);
  float a01 = a / TAU + .5;
  vec4 col = vec4(0.);

  // brush-stroke accretion ring, slowly turning
  float s = fbm(vec2(r * 55., a01 * 16. - spin * .25), 16.);
  float lower = .5 + .5 * cos(a + 2.4);
  float w = .03 + .055 * lower + .035 * fbm(vec2(1.7, a01 * 6. - spin * .05), 6.);
  float d = (r - R) / w + (s - .5) * .9;
  float ringA = smoothstep(-.1, .05, d) * smoothstep(1.05, .55, d);
  ringA *= smoothstep(.2, .45, s + .4 * (1. - d));

  vec3 warm = mix(CREAM, YEL, smoothstep(.15, .45, d));
  warm = mix(warm, ORA, smoothstep(.4, .7, d));
  warm = mix(warm, RED, smoothstep(.72, .95, d));

  float band = fract(d * 2.2 + s * .7);
  vec3 bands = mix(CYAN, YEL, step(.34, band));
  bands = mix(bands, ORA, step(.67, band));
  bands = mix(CREAM, bands, smoothstep(.1, .3, d));
  float cool = smoothstep(.3, .95, cos(a - .6));
  vec3 ringC = mix(warm, bands, cool * .9);

  col.rgb += ORA * exp(-max(r - R, 0.) * 9.) * .2 * (.4 + lower);
  over(col, ringC, ringA);

  // spatter, drifting with the ring
  float ca = cos(spin * .012), sa = sin(spin * .012);
  vec2 g = mat2(ca, -sa, sa, ca) * uv * 48.;
  vec2 id = floor(g);
  float h = hash(id);
  vec2 off = vec2(hash(id + 3.1), hash(id + 7.7)) - .5;
  float sz = .07 + .17 * hash(id + 1.3);
  float zone = smoothstep(R + .02, R + .08, r) * smoothstep(R + .34, R + .1, r) * (.3 + lower);
  float speck = step(.88, h) * smoothstep(sz, sz * .5, length(fract(g) - .5 - off * .5)) * zone;
  vec3 sc = mix(mix(ORA, YEL, hash(id + 5.)), RED, step(.7, hash(id + 9.)));
  over(col, sc, clamp(speck, 0., 1.) * (.75 + .25 * sin(t * .3 + h * 40.)));

  // jets above and below
  vec2 qt = vec2(uv.x + .012, uv.y - R * .85);
  vec2 qb = vec2(uv.x - .018, -uv.y - R * .85);
  vec4 st = uv.y > 0. ? streak(qt, 0.) : streak(qb, 51.);
  over(col, st.rgb, st.a);
  over(col, HOLE, uv.y > 0. ? tail(qt) : tail(qb));

  float Re = R + .007 * (fbm(vec2(t * .04, a01 * 60.), 60.) - .5);
  over(col, HOLE, smoothstep(Re + .004, Re - .004, r));

  gl_FragColor = col;
}
</script>

<script id="blit" type="x-shader/x-fragment">
uniform sampler2D tex;
void main() {
  vec2 q = gl_FragCoord.xy / res;
  float r = length(view());
  gl_FragColor = vec4(texture2D(tex, q).rgb * (1. - .35 * smoothstep(.4, 1.2, r)), 1.);
}
</script>

<script id="dust-v" type="x-shader/x-vertex">
attribute vec4 a;
uniform vec2 res;
uniform vec2 m;
uniform float side, px;
varying float vSeed, vZ;
void main() {
  float f = 1.6 / (1.6 + a.z);
  vec2 p = (a.xy + m * .04 * a.z) * f - m * .015;
  bool keep = side > 0. ? a.z >= 0. : a.z < 0.;
  gl_Position = keep ? vec4(p * 2. * min(res.x, res.y) / res, 0., 1.) : vec4(2., 2., 2., 1.);
  gl_PointSize = (2. + 6. * pow(fract(a.w * 7.), 3.)) * f * f * px;
  vSeed = a.w;
  vZ = a.z;
}
</script>

<script id="dust-f" type="x-shader/x-fragment">
precision mediump float;
uniform float amt;
varying float vSeed, vZ;
void main() {
  float d = smoothstep(.5, 0., length(gl_PointCoord - .5));
  vec3 c = mix(vec3(.98, .72, .38), vec3(.45, .72, .95), step(.62, fract(vSeed * 13.)));
  gl_FragColor = vec4(c * d * d * amt * 1.8 * smoothstep(.9, -.3, vZ), 0.);
}
</script>

  ([bg]) => [bg, "none"],
  ([bg, , , , , s1]) => [`linear-gradient(135deg, ${bg}, ${tint(bg, s1, 70)})`, "none"],
  ([bg, ink]) => [`repeating-linear-gradient(45deg, ${bg} 0 8px, ${tint(bg, ink, 90)} 8px 16px)`, "none"],
  ([bg, ink]) => [`radial-gradient(${tint(bg, ink, 78)} 1px, transparent 1.5px) 0 0 / 10px 10px, ${bg}`, "none"],
  ([bg]) => [tint(bg, "transparent", 68), "blur(10px)"],
  ([bg, ink]) => [`linear-gradient(${tint(bg, ink, 90)} 1px, transparent 1px) 0 0 / 12px 12px, linear-gradient(90deg, ${tint(bg, ink, 90)} 1px, transparent 1px) 0 0 / 12px 12px, ${bg}`, "none"],
];
const SHADOWS = [
  ([, , , , , s1, s2]) => `4px 4px 0 ${s1}, 8px 8px 0 ${s2}`,
  ([, , , , , , s2]) => `5px 5px 0 ${s2}`,
  ([, , , , , , s2]) => `0 10px 30px ${tint(s2, "transparent", 45)}`,
  ([, , fill]) => `0 0 0 1px ${fill}, 0 0 18px ${tint(fill, "transparent", 60)}`,
  ([, ink]) => `0 0 0 2px ${ink}`,
  () => "none",
];
const RADII = ["8px", "0px", "4px", "14px", "22px"];
const THUMBS = [["14px", "14px", "50%"], ["12px", "12px", "2px"], ["6px", "16px", "2px"]];

const luma = (hex) => {
  const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255)
    .map((c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
};
const contrast = (a, b) => {
  const [hi, lo] = [luma(a), luma(b)].sort((x, y) => y - x);
  return (hi + 0.05) / (lo + 0.05);
};

// first candidate hitting 4.5:1, else black/white
const readable = (on, candidates) =>
  [...candidates, "#111111", "#ffffff"].find((c) => contrast(c, on) >= 4.5)
  ?? (contrast("#111111", on) > contrast("#ffffff", on) ? "#111111" : "#ffffff");

const seeded = (a) => () => {
  a = (a + 0x6d2b79f5) | 0;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};

// style 0 is the HOPE look; the rest are fixed seeded mixes
function applyStyle(i) {
  const r = seeded(i * 9973 + 1);
  const any = (xs) => (i === 0 ? xs[0] : xs[Math.floor(r() * xs.length)]);
  const pal = PALETTES[i % PALETTES.length];
  const [family, size, fstyle] = any(UI_FONTS);
  const [panel, blur] = any(PANELS)(pal);
  const [tw, th, tr] = any(THUMBS);
  const vars = {
    bg: pal[0], ink: pal[1], fill: pal[2],
    "btn-ink": readable(pal[2], [pal[0], pal[1]]), track: pal[3], thumb: pal[4], muted: pal[7],
    font: family, fs: `${size}px`, fstyle, case: i === 0 || r() < 0.7 ? "none" : "lowercase",
    panel, blur, shadow: any(SHADOWS)(pal), radius: any(RADII), tw, th, tr,
  };
  const el = document.getElementById("fx");
  for (const [k, v] of Object.entries(vars)) el.style.setProperty(`--${k}`, v);
}

const form = document.querySelector("#fx form");
const fmt = (k) => FX.find((f) => f[0] === k)[4]?.(fx[k]) ?? Math.round(fx[k] * 100);
for (const [k, label, , max = 1, , step = 0.01] of FX) {
  const row = document.createElement("label");
  row.innerHTML = `<span>${label}</span><input type="range" min="0" max="${max}" step="${step}" name="${k}" value="${fx[k]}"><output>${fmt(k)}</output>`;
  form.append(row);
}
const sync = (k) => {
  const input = form.elements[k];
  input.value = fx[k];
  input.nextElementSibling.value = fmt(k);
  input.style.setProperty("--p", `${(fx[k] / input.max) * 100}%`);
  if (k === "style") applyStyle(fx.style);
};
FX.forEach(([k]) => sync(k));
form.addEventListener("input", (e) => {
  fx[e.target.name] = +e.target.value;
  sync(e.target.name);
  try { localStorage.setItem("fx", JSON.stringify(fx)); } catch {}
});
form.addEventListener("reset", (e) => {
  e.preventDefault();
  for (const [k, , v] of FX) {
    fx[k] = v;
    sync(k);
  }
  try { localStorage.removeItem("fx"); } catch {}
});

// ---- void ----
const canvas = document.getElementById("void");
const gl = canvas.getContext("webgl", { antialias: false, alpha: false, premultipliedAlpha: false });
const mouse = [0, 0];
const smooth = [0, 0];
const src = (id) => document.getElementById(id).textContent;

if (gl) {
  const program = (vert, frag) => {
    const p = gl.createProgram();
    for (const [type, code] of [[gl.VERTEX_SHADER, vert], [gl.FRAGMENT_SHADER, frag]]) {
      const s = gl.createShader(type);
      gl.shaderSource(s, code);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
      gl.attachShader(p, s);
    }
    gl.bindAttribLocation(p, 0, "a");
    gl.linkProgram(p);
    const u = new Proxy({}, { get: (c, n) => c[n] ??= gl.getUniformLocation(p, n) });
    return { p, u };
  };
  const quadV = "attribute vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }";
  const bg = program(quadV, src("common") + src("bg"));
  const fg = program(quadV, src("common") + src("fg"));
  const blit = program(quadV, src("common") + src("blit"));
  const dust = program("precision highp float;\n" + src("dust-v"), src("dust-f"));

  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);

  // particles: x, y, z, seed in the shader's view units
  const N = 3000;
  const P = new Float32Array(N * 4);
  const R = 0.13;
  const spawn = (i, anywhere) => {
    const ang = Math.random() * Math.PI * 2, r = anywhere ? 0.2 + Math.random() * 1.2 : 1.1 + Math.random() * 0.4;
    P.set([Math.cos(ang) * r, Math.sin(ang) * r, (Math.random() - 0.5) * 1.2, Math.random()], i * 4);
  };
  for (let i = 0; i < N; i++) spawn(i, true);
  const dustBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, dustBuf);
  gl.bufferData(gl.ARRAY_BUFFER, P, gl.DYNAMIC_DRAW);

  // analytic curl of a sine potential: divergence-free swirl
  const stepDust = (dt, t) => {
    for (let i = 0; i < N; i++) {
      const o = i * 4;
      const x = P[o], y = P[o + 1], z = P[o + 2];
      const cx = -2.3 * Math.sin(y * 2.3 + t * 0.1) - 1.7 * Math.cos(z * 1.7 - t * 0.07);
      const cy = -1.9 * Math.sin(z * 1.9 + t * 0.08) - 2.1 * Math.cos(x * 2.1 + t * 0.05);
      const cz = -2.7 * Math.sin(x * 2.7 - t * 0.06) - 1.3 * Math.cos(y * 1.3 + t * 0.09);
      const r = Math.hypot(x, y) + 1e-4;
      const swirl = 0.1 * fx.spin / (r + 0.15), pull = 0.035 / (r + 0.05);
      P[o] += (cx * 0.03 - (y / r) * swirl - (x / r) * pull) * dt;
      P[o + 1] += (cy * 0.03 + (x / r) * swirl - (y / r) * pull) * dt;
      P[o + 2] += (cz * 0.03 - z * 0.15) * dt;
      if (r < R * 0.9 || r > 1.6) spawn(i, false);
    }
  };

  let bgTex, bgFbo, bgW, bgH;
  const resize = () => {
    const s = Math.min(devicePixelRatio, 2);
    canvas.width = innerWidth * s;
    canvas.height = innerHeight * s;
    // background noise is soft; half resolution keeps the volumetric layers affordable
    bgW = Math.ceil(canvas.width / 2);
    bgH = Math.ceil(canvas.height / 2);
    if (bgTex) gl.deleteTexture(bgTex);
    bgTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, bgTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, bgW, bgH, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR],
      [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
    bgFbo ??= gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, bgFbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, bgTex, 0);
  };
  addEventListener("resize", resize);
  resize();

  const speed = reduced ? 0.2 : 1;
  let prev = 0, spin = 0;

  const common = ({ u }, w, h, t) => {
    gl.uniform2f(u.res, w, h);
    gl.uniform1f(u.t, t);
    gl.uniform2f(u.m, smooth[0], smooth[1]);
  };
  const drawQuad = () => {
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };
  const drawDust = (side) => {
    gl.useProgram(dust.p);
    gl.uniform2f(dust.u.res, canvas.width, canvas.height);
    gl.uniform2f(dust.u.m, smooth[0], smooth[1]);
    gl.uniform1f(dust.u.side, side);
    gl.uniform1f(dust.u.px, canvas.width / innerWidth);
    gl.uniform1f(dust.u.amt, fx.dust);
    gl.bindBuffer(gl.ARRAY_BUFFER, dustBuf);
    gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.POINTS, 0, N);
  };

  const frame = (ms) => {
    const t = ms / 1000 * speed;
    const dt = Math.min((ms - prev) / 1000, 0.05) * speed;
    prev = ms;
    spin += dt * fx.spin;
    smooth[0] += (mouse[0] - smooth[0]) * 0.02;
    smooth[1] += (mouse[1] - smooth[1]) * 0.02;
    follow();

    gl.disable(gl.BLEND);
    gl.bindFramebuffer(gl.FRAMEBUFFER, bgFbo);
    gl.viewport(0, 0, bgW, bgH);
    gl.useProgram(bg.p);
    common(bg, bgW, bgH, t);
    gl.uniform1f(bg.u.uNest, fx.nest);
    gl.uniform1f(bg.u.uNeb, fx.neb);
    gl.uniform1f(bg.u.uStars, fx.stars);
    gl.uniform1f(bg.u.uTunnel, fx.tunnel);
    gl.uniform1f(bg.u.uLens, fx.lens);
    drawQuad();

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(blit.p);
    common(blit, canvas.width, canvas.height, t);
    gl.bindTexture(gl.TEXTURE_2D, bgTex);
    drawQuad();

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    if (fx.dust > 0) {
      stepDust(dt, t);
      gl.bindBuffer(gl.ARRAY_BUFFER, dustBuf);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, P);
      drawDust(1);
    }
    gl.useProgram(fg.p);
    common(fg, canvas.width, canvas.height, t);
    gl.uniform1f(fg.u.spin, spin);
    drawQuad();
    if (fx.dust > 0) drawDust(-1);

    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

addEventListener("pointermove", (e) => {
  mouse[0] = e.clientX / innerWidth * 2 - 1;
  mouse[1] = 1 - e.clientY / innerHeight * 2;
});

// ---- words ----
const pick = (xs) => xs[Math.floor(Math.random() * xs.length)];
const rand = (a, b) => a + Math.random() * (b - a);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const MAX_WORDS = 4;
const shown = new Set();

// keeps the word on screen and off the hole and its jets
function place(el) {
  const w = el.offsetWidth / 2 + 16, h = el.offsetHeight / 2 + 16;
  const cx = innerWidth / 2, cy = innerHeight / 2, keep = Math.min(innerWidth, innerHeight) * 0.3;
  let best, bestScore = -Infinity;
  for (let i = 0; i < 40 && bestScore < keep; i++) {
    const x = rand(w, Math.max(w, innerWidth - w));
    const y = rand(h, Math.max(h, innerHeight - h));
    const dx = Math.max(Math.abs(x - cx) - w, 0), dy = Math.max(Math.abs(y - cy) - h, 0);
    const onJet = dx < keep * 0.25 && dy < keep * 1.3;
    const score = Math.hypot(dx, dy) - (onJet ? keep : 0);
    if (score > bestScore) [best, bestScore] = [[x, y], score];
  }
  return best;
}

function look() {
  const [family, style, weight] = pick(FONTS);
  return {
    fontFamily: `"${family}", serif`,
    fontStyle: style,
    fontWeight: weight,
    letterSpacing: `${rand(-0.02, 0.2)}em`,
    color: pick(COLORS),
    textTransform: pick(["none", "none", "uppercase", "lowercase"]),
  };
}

function fitWidth(el) {
  const fit = (innerWidth - 32) / el.offsetWidth;
  if (fit < 1) el.style.fontSize = `${parseFloat(el.style.fontSize) * fit}vmin`;
}

async function show() {
  const free = WORDS.filter((w) => !shown.has(w));
  const word = pick(free.length ? free : WORDS);
  shown.add(word);

  const st = look();
  await document.fonts.load(`${st.fontStyle} ${st.fontWeight} 40px ${st.fontFamily}`, word).catch(() => {});
  const el = document.createElement("p");
  el.className = "word";
  el.setAttribute("aria-hidden", "true");
  Object.assign(el.style, st, { fontSize: `${rand(4, 9)}vmin` });
  el.replaceChildren(...[...word].map((c) => Object.assign(document.createElement("span"), { textContent: c })));
  document.body.append(el);

  fitWidth(el);

  const hold = rand(4000, reduced ? 16000 : 14000);
  const life = (word.length * 175 + hold + 2600) / 1000;
  const [x, y] = place(el);
  const angle = rand(-4, 4);
  el.style.left = `${x}px`;
  el.style.top = `${y}px`;
  el.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
  el.offsetWidth;
  if (!reduced) {
    el.style.transition = `opacity 2.2s ease-in, filter 2.2s ease-in, transform ${life}s linear`;
    el.style.transform = `translate(calc(-50% + ${rand(-40, 40)}px), calc(-50% + ${rand(-28, 28)}px)) rotate(${angle + rand(-1.5, 1.5)}deg)`;
  } else {
    el.style.transition = "opacity 2.2s ease-in, filter 2.2s ease-in";
  }

  for (const span of el.children) {
    span.classList.add("on");
    if (!reduced) await wait(rand(110, 240));
  }
  await wait(hold);

  el.style.opacity = 0;
  el.style.filter = "blur(10px)";
  await wait(2600);
  el.remove();
  shown.delete(word);
}

async function spawn() {
  if (shown.size < MAX_WORDS) show();
  await wait(rand(1200, reduced ? 6000 : 4500));
  spawn();
}

spawn();

// ---- message ----
const msg = document.getElementById("msg");
const input = msg.querySelector("textarea");
const say = msg.querySelector(".say");
const caret = Object.assign(document.createElement("i"), { className: "caret" });
const looks = [];

// tracks the hole's parallax offset from view()
function follow() {
  const k = Math.min(innerWidth, innerHeight) * 0.015;
  msg.style.translate = `${smooth[0] * k}px ${-smooth[1] * k}px`;
}

// largest font that keeps the text inside the square
function fit() {
  const s = msg.offsetWidth;
  let lo = s * 0.078, hi = s * 0.28;
  say.style.overflowWrap = "normal";
  for (let n = 0; n < 8; n++) {
    const mid = (lo + hi) / 2;
    say.style.fontSize = `${mid}px`;
    if (say.offsetHeight <= s && say.scrollWidth <= s) lo = mid;
    else hi = mid;
  }
  say.style.fontSize = `${lo}px`;
  say.style.overflowWrap = "";
}

const node = (text, st) => {
  if (!st) return document.createTextNode(text);
  const el = Object.assign(document.createElement("span"), { textContent: text });
  Object.assign(el.style, st);
  return el;
};

// the textarea is invisible; this mirrors it word by word with a fake caret
function render() {
  const text = input.value, at = input.selectionEnd;
  const nodes = [];
  let i = 0, w = 0;
  for (const tok of text.match(/\s+|\S+/g) ?? []) {
    const st = /\S/.test(tok) && (looks[w++] ??= { ...look(), fontSize: `${rand(0.85, 1.15)}em` });
    const k = at - i;
    if (k > 0 && k < tok.length) nodes.push(node(tok.slice(0, k), st), caret, node(tok.slice(k), st));
    else nodes.push(...(k === 0 ? [caret] : []), node(tok, st));
    i += tok.length;
  }
  if (at === text.length) nodes.push(caret);
  say.replaceChildren(...nodes);
  fit();
}

// TODO: wire to a backend
const send = (text) => {};

input.addEventListener("input", render);
document.addEventListener("selectionchange", () => document.activeElement === input && render());
document.fonts.addEventListener("loadingdone", fit);
addEventListener("resize", fit);
addEventListener("click", (e) => {
  if (e.target.closest("#fx")) return;
  input.focus();
  // the square ignores pointer events, so hit-test it by position
  const r = msg.getBoundingClientRect();
  if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) {
    looks.length = 0;
    render();
    for (const el of document.querySelectorAll(".word")) {
      Object.assign(el.style, look());
      fitWidth(el);
    }
  }
});

input.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  send(text);
  caret.remove();
  const el = say.cloneNode(true);
  el.classList.add("fall");
  el.style.width = `${msg.offsetWidth}px`;
  el.style.translate = msg.style.translate;
  document.body.append(el);
  const end = `translate(-50%, -50%) scale(0) rotate(${reduced ? 0 : 540}deg)`;
  el.animate(
    [{ transform: "translate(-50%, -50%)" }, { transform: end, opacity: 0, filter: "blur(6px)" }],
    { duration: reduced ? 800 : 1800, easing: "cubic-bezier(.55, 0, .9, .4)" },
  ).finished.then(() => el.remove());
  input.value = "";
  looks.length = 0;
  render();
});

render();
</script>
</body>
</html>
